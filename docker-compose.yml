# this docker compose file is for testing purpose

services:
  rustfs:
    restart: unless-stopped
    image: rustfs/rustfs:1.0.6
    ports:
      - 9100:9000
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 12
